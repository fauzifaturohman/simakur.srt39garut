        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }

        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Styling untuk elemen yang bisa diedit */
        [contenteditable="true"] {
            border-bottom: 2px dashed #818cf8;
            background-color: rgba(224, 231, 255, 0.5);
            padding: 2px 6px;
            border-radius: 6px;
            outline: none;
            transition: all 0.2s ease-in-out;
            cursor: text;
        }
        [contenteditable="true"]:focus {
            background-color: rgba(224, 231, 255, 1);
            border-bottom: 2px solid #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        /* Tampilan khusus saat dicetak (Print) */
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            #main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; overflow: visible !important;}
            .print-shadow-none { box-shadow: none !important; border: 1px solid #e2e8f0; }
            [contenteditable="true"] { border: none; background: transparent; padding: 0; }
            .page-break { page-break-before: always; }
        }
        
        /* Animasi */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

        defaultData.teachers.forEach(t => {

            const hash = Array.from(t.nip).reduce((acc, char) => acc + char.charCodeAt(0), 0);
            t.photo = `https://placehold.co/150x150/${colors[hash % colors.length]}/ffffff?text=${initials}`;
        });

        // State Manager
        let appState = JSON.parse(localStorage.getItem('srt39_data')) || defaultData;
        let currentUser = JSON.parse(localStorage.getItem('srt39_user'));

        function saveState() {
            localStorage.setItem('srt39_data', JSON.stringify(appState));
        }

        // Helper: Update Data dari Elemen contenteditable
        function updateData(path, value) {
            let parts = path.split('.');
            let obj = appState;
            for (let i = 0; i < parts.length - 1; i++) {
                if (!obj[parts[i]]) obj[parts[i]] = {};
                obj = obj[parts[i]];
            }
            obj[parts[parts.length - 1]] = value;
            saveState();
        }

        function updateArrayItem(arrayName, index, key, value) {
            appState[arrayName][index][key] = value;
            saveState();
        }

        // Helper: Format Atribut Editable
        function getEditableAttr(path) {
            return appState.isEditMode ? `contenteditable="true" onblur="updateData('${path}', this.innerText)" title="Klik untuk mengedit"` : '';
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-rose-500' : 'bg-indigo-500';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            toast.className = `flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg text-white font-medium ${bg} fade-in`;
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleEditMode() {
            appState.isEditMode = !appState.isEditMode;
            saveState();
            updateEditBtnUI();
            router(); // Re-render current page
            showToast(appState.isEditMode ? 'Mode Edit Diaktifkan' : 'Mode Edit Dinonaktifkan', 'info');
        }

        function updateEditBtnUI() {
            const btn = document.getElementById('edit-toggle-btn');
            const status = document.getElementById('edit-status');
            if(appState.isEditMode) {
                btn.classList.replace('bg-slate-100', 'bg-indigo-600');
                btn.classList.replace('text-slate-600', 'text-white');
                btn.classList.replace('hover:bg-slate-200', 'hover:bg-indigo-700');
                status.innerText = 'ON';
            } else {
                btn.classList.replace('bg-indigo-600', 'bg-slate-100');
                btn.classList.replace('text-white', 'text-slate-600');
                btn.classList.replace('hover:bg-indigo-700', 'hover:bg-slate-200');
                status.innerText = 'OFF';
            }
        }

        function initAuth() {
            if (currentUser) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-wrapper').classList.remove('hidden');
                
                // Set UI Profil Topbar/Sidebar
                document.getElementById('user-avatar').src = currentUser.photo;
                document.getElementById('user-name').innerText = currentUser.name.split(',')[0]; // Ambil nama depan saja
                document.getElementById('user-role').innerText = currentUser.role;
                
                updateEditBtnUI();
                router();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-wrapper').classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const nip = document.getElementById('login-nip').value;
            const pass = document.getElementById('login-pass').value;
            
            // Pencarian user di database mockup (teachers)
            const user = appState.teachers.find(t => t.nip === nip);
            
            if (user && pass === 'srt2026') {
                currentUser = user;
                localStorage.setItem('srt39_user', JSON.stringify(currentUser));
                showToast(`Selamat datang, ${user.name}!`);
                initAuth();
            } else {
                showToast('NIP atau Password salah!', 'error');
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('srt39_user');
            appState.isEditMode = false; // reset edit mode
            saveState();
            initAuth();
        }

        function router() {
            if(!currentUser) return;
            const hash = window.location.hash || '#dashboard';
            const container = document.getElementById('view-container');

                case '#administrasi':

                    </form>
                </div>
                ` : ''}

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    ${html}
                </div>
            </div>
            `;
        }

        // Fungi Tambah/Hapus Guru
        function handleAddTeacher(e) {
            e.preventDefault();
            const nip = document.getElementById('new-g-nip').value;
            const name = document.getElementById('new-g-name').value;
            const role = document.getElementById('new-g-role').value;
            
            if(appState.teachers.some(t => t.nip === nip)) return showToast('NIP sudah terdaftar!', 'error');

            const initials = name.replace(/[^a-zA-Z ]/g, "").split(' ').slice(0,2).map(n => n[0]).join('').toUpperCase();
            const photo = `https://placehold.co/150x150/8b5cf6/ffffff?text=${initials}`;
            
            appState.teachers.push({ nip, name, role, classes: "-", photo });
            saveState();
            router();
            showToast('Guru berhasil ditambahkan!');
        }

        function deleteTeacher(nip) {
            if(confirm('Yakin ingin menghapus data guru ini?')) {
                appState.teachers = appState.teachers.filter(t => t.nip !== nip);
                saveState();
                router();
                showToast('Data guru dihapus', 'info');
            }
        }

        function renderAdmin() {
            let trs = appState.adminLinks.length === 0 
                ? `<tr><td colspan="5" class="py-8 text-center text-slate-400">Belum ada dokumen yang diunggah.</td></tr>` 
                : appState.adminLinks.map((doc, idx) => `
                <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                    <td class="py-4 px-4 text-sm font-medium text-slate-800">${doc.name} <br><span class="text-xs text-slate-400 font-normal">${doc.nip}</span></td>
                    <td class="py-4 px-4"><span class="px-2 py-1 bg-slate-100 text-slate-600 rounded-md text-xs font-medium">${doc.category}</span></td>
                    <td class="py-4 px-4 text-sm text-slate-700 max-w-xs truncate" title="${doc.title}">${doc.title}</td>
                    <td class="py-4 px-4 text-sm text-slate-500">${doc.date}</td>
                    <td class="py-4 px-4 text-center">
                        <a href="${doc.link}" target="_blank" class="w-8 h-8 inline-flex items-center justify-center bg-indigo-50 text-primary rounded-full hover:bg-primary hover:text-white transition shadow-sm" title="Buka Tautan"><i class="fas fa-external-link-alt text-xs"></i></a>
                        ${appState.isEditMode || doc.nip === currentUser.nip ? `<button onclick="deleteAdmin(${doc.id})" class="w-8 h-8 inline-flex items-center justify-center bg-rose-50 text-rose-500 rounded-full hover:bg-rose-500 hover:text-white transition shadow-sm ml-1 no-print" title="Hapus"><i class="fas fa-trash text-xs"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');

            return `
            <div class="fade-in space-y-6">
                <div class="bg-gradient-to-r from-sky-500 to-indigo-500 rounded-3xl p-8 text-white shadow-sm flex flex-col md:flex-row justify-between items-center gap-6 no-print print-shadow-none">
                    <div>
                        <h2 class="text-2xl font-bold mb-1"><i class="fab fa-google-drive mr-2"></i>Pusat Administrasi Guru</h2>
                        <p class="text-sky-100 text-sm">Unggah tautan Google Drive berisi perangkat ajar Anda disini.</p>
                    </div>
                </div>

                <!-- Form Upload -->
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 no-print">
                    <h3 class="font-bold text-slate-800 mb-4 text-lg">Tambah Dokumen Baru</h3>
                    <form onsubmit="handleUpload(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4">
                        <div class="md:col-span-3">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Kategori</label>
                            <select id="up-cat" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none text-sm font-medium text-slate-700">
                                <option value="Modul Ajar / RPP">Modul Ajar / RPP</option>
                                <option value="Daftar Nilai">Daftar Nilai</option>
                                <option value="Jurnal Mengajar">Jurnal Mengajar</option>
                                <option value="Bahan Ajar">Bahan Ajar</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Judul Dokumen</label>
                            <input type="text" id="up-title" required placeholder="Cth: Modul IPAS Bab 1" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none text-sm">
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Link Google Drive</label>
                            <input type="url" id="up-link" required placeholder="https://drive.google.com/..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none text-sm">
                        </div>
                        <div class="md:col-span-2 flex items-end">
                            <button type="submit" class="w-full py-2.5 bg-slate-800 text-white font-semibold rounded-xl hover:bg-black transition shadow-sm text-sm"><i class="fas fa-cloud-upload-alt mr-2"></i>Simpan</button>
                        </div>
                    </form>
                </div>

                <!-- Tabel Rekap -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                                    <th class="py-4 px-4 font-semibold">Guru Pengunggah</th>
                                    <th class="py-4 px-4 font-semibold">Kategori</th>
                                    <th class="py-4 px-4 font-semibold">Judul Dokumen</th>
                                    <th class="py-4 px-4 font-semibold">Tanggal</th>
                                    <th class="py-4 px-4 font-semibold text-center no-print">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${trs}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        function handleUpload(e) {
            e.preventDefault();
            const cat = document.getElementById('up-cat').value;
            const title = document.getElementById('up-title').value;
            const link = document.getElementById('up-link').value;
            
            appState.adminLinks.unshift({
                id: Date.now(),
                nip: currentUser.nip,
                name: currentUser.name,
                category: cat,
                title: title,
                link: link,
                date: new Date().toLocaleDateString('id-ID')
            });
            
            saveState();
            router();
            showToast('Tautan administrasi berhasil disimpan!');
        }

        function deleteAdmin(id) {
            if(confirm('Hapus dokumen ini?')) {
                appState.adminLinks = appState.adminLinks.filter(d => d.id !== id);
                saveState();
                router();
            }
        }

        window.onload = () => {
            initAuth();
            
            // Tutup sidebar di mobile jika klik area luar
            document.getElementById('main-content').addEventListener('click', (e) => {
                if(window.innerWidth < 768 && !e.target.closest('#sidebar') && !e.target.closest('header button.md\\:hidden')) {
                    document.getElementById('sidebar').classList.add('-translate-x-full');
                }
            });
        };
    </script>
</body>
</html>
